[tool.poetry]
name = "recoveryos"
version = "0.1.0"
description = "AI Revenue Recovery Control Plane — Razorpay Track 03"
authors = ["RecoveryOS Team"]
readme = "README.md"
packages = [{ include = "recoveryos" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
alembic = "^1.14.0"
redis = "^5.2.0"
prometheus-client = "^0.21.0"
httpx = "^0.28.0"
structlog = "^24.4.0"
openai = "^1.57.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
testcontainers = { extras = ["postgres", "redis"], version = "^4.9.0" }
aiohttp = "^3.10.0"
playwright = "^1.48.0"
pytest-playwright = "^0.5.2"
ruff = "^0.8.0"
black = "^24.10.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# X/X_train/X_val is sklearn's own convention for feature matrices —
# renaming to lowercase would fight the ecosystem's naming, not improve it.
"tests/unit/test_episodes.py" = ["N806"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own documented pattern is `param: T = Depends(...)` — a function
# call in an argument default. B008 exists to catch mutable-default-style
# footguns, not this; without this, every route/dependency in the codebase
# trips it.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `python -m pytest` adds cwd to sys.path automatically; bare `pytest`
# (what CI actually runs) doesn't. Without this, apps/recoveryos/services
# aren't importable in CI even though it works fine locally.
pythonpath = ["."]
markers = [
    "e2e: needs `npm install`/Playwright chromium in apps/dashboard/ and a real Node dev server -- excluded from CI's plain `pytest tests/integration/`, run explicitly with `pytest -m e2e`",
]
