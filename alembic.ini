# Alembic Configuration — RecoveryOS
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
script_location = migrations
prepend_sys_path = .
# URL is overridden at runtime by env.py reading from Settings (this line is
# never actually used to connect — env.py's config.set_main_option() runs
# unconditionally before any command). Task 6: kept as an inert, obviously-
# fake placeholder rather than a real (now-compromised) credential, in case
# anyone is ever tempted to trust it directly.
sqlalchemy.url = postgresql://recoveryos:CHANGE_ME@localhost:5432/recoveryos

[post_write_hooks]
# No post-write hooks in scaffold

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
