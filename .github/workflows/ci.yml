name: RecoveryOS CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint deps
        # Pinned to match pyproject.toml's [tool.poetry.group.dev.dependencies]
        # constraints exactly — an unpinned `pip install black` grabs whatever
        # is latest at CI run time, and black's formatting rules genuinely
        # change across major versions (confirmed: 26.x reformats multi-line
        # text() calls differently than the 24.x this project is pinned to,
        # so CI flip-flops between "clean" and "needs reformat" depending on
        # nothing anyone here changed).
        run: pip install "ruff>=0.8,<0.9" "black>=24.10,<25"

      - name: ruff check
        run: ruff check recoveryos/ apps/ services/ workers/ tests/ --output-format=github

      - name: black check
        run: black --check recoveryos/ apps/ services/ workers/ tests/

  # ─── Security Gate — no SELECT * in inference paths ───────────────────────
  security-grep:
    name: CI Security Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Gate: no SELECT * in inference/training code (gaps.md §B.1)"
        run: |
          echo "Checking for SELECT * in inference-reachable code..."
          found=$(grep -rn "SELECT \*" services/recovery_engine/ models/ services/diagnosis_engine/ 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "ERROR: SELECT * found in inference-reachable code:"
            echo "$found"
            exit 1
          fi
          echo "OK — no SELECT * violations found."

      - name: "Gate: no forbidden imports in policy_engine/rules.py (gaps.md §B.3)"
        run: |
          rules_file="services/policy_engine/rules.py"
          if [ -f "$rules_file" ]; then
            forbidden=$(grep -n "import db\|import sqlalchemy\|import redis\|import requests\|import httpx" "$rules_file" || true)
            if [ -n "$forbidden" ]; then
              echo "ERROR: Forbidden I/O imports found in policy engine rules:"
              echo "$forbidden"
              exit 1
            fi
            echo "OK — policy engine rules.py has no forbidden imports."
          else
            echo "rules.py not yet created — skipping gate (will enforce in Phase 5)."
          fi

  # ─── Unit Tests (no DB needed) ────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        # pandas + scikit-learn: services/recovery_engine/propensity.py imports
        # both at module level (pandas directly; scikit-learn is required to
        # unpickle model_lr.pkl/feature_transformer_v1.pkl -- pickle needs the
        # actual sklearn classes available to reconstruct them). Every test
        # module that imports anything from services.recovery_engine transitively
        # imports propensity.py, so without these two, collection itself fails
        # with ModuleNotFoundError before a single test runs (Task MD1,
        # pre-Phase-8 audit -- this was happening on every CI run and going
        # unnoticed because local dev environments already had these installed).
        run: |
          pip install \
            pytest pytest-asyncio pytest-cov \
            pydantic pydantic-settings \
            sqlalchemy asyncpg psycopg2-binary \
            alembic fastapi uvicorn httpx \
            redis structlog prometheus-client \
            pyyaml pandas scikit-learn

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          ENV: test
          DATABASE_URL: postgresql+asyncpg://x:x@localhost:5432/x
          DATABASE_URL_SYNC: postgresql://x:x@localhost:5432/x
          REDIS_URL: redis://localhost:6379/0

  # ─── Integration Tests (real Postgres via testcontainers) ─────────────────
  integration-tests:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Extra names verified against the installed package's own Provides-Extra
      # metadata (testcontainers 4.15.0, matching pyproject.toml's ^4.9.0 pin) —
      # "postgres", not "postgresql". The latter is silently accepted by pip as
      # an unknown-extra no-op (pip just warns, doesn't fail), so a typo here
      # would not show up as a CI failure — it would just quietly drop whatever
      # that extra was supposed to pull in. "redis" is a real gated dependency
      # (redis>=7); "postgres" itself currently adds nothing beyond the base
      # package (PostgresContainer needs no extra driver deps from
      # testcontainers — psycopg2-binary/asyncpg above cover that), but the
      # correct name is used regardless so a future testcontainers release that
      # does gate something behind it doesn't silently go missing again.
      - name: Install deps (including testcontainers)
        # pandas + scikit-learn: same reason as the unit-tests job above --
        # services/recovery_engine/orchestrator.py (imported by several
        # integration tests) imports services.recovery_engine.propensity,
        # which needs both to import and to unpickle its model artifacts.
        # pyyaml: propensity.py's import chain (simulator/episodes/generator.py
        # -> simulator/payments/distributions.py -> simulator/calibration/loader.py)
        # reaches a bare `import yaml` -- same transitive-dependency gap as
        # pandas/scikit-learn, just one hop further down the chain.
        run: |
          pip install \
            pytest pytest-asyncio pytest-cov \
            pydantic pydantic-settings \
            sqlalchemy asyncpg psycopg2-binary \
            alembic fastapi uvicorn httpx aiohttp \
            redis structlog prometheus-client \
            pandas scikit-learn pyyaml \
            "testcontainers[postgres,redis]"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          ENV: test

  # Adversarial-style tests (test_diagnosis_adversarial.py,
  # test_next_best_action_negative_control.py, etc.) live under tests/unit/
  # and tests/integration/ and already run in those jobs above. The
  # dedicated tests/adversarial/ directory this job used to target was an
  # empty scaffold (__init__.py only, zero test files) that had never
  # actually run to completion -- this job's own `needs: [unit-tests]` meant
  # it was always skipped while unit-tests was broken, so its
  # "no tests collected" failure (pytest exit code 5) was invisible until
  # unit-tests started passing. Removed rather than kept as a placeholder --
  # same reasoning as the dead models/anomaly/ and models/recovery_propensity/
  # packages found in the same audit pass.
