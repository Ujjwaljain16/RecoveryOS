apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Explicit, stable uid (not Grafana's auto-generated one) so
    # monitoring/grafana/provisioning/dashboards/recoveryos-control-tower.json
    # can reference it directly instead of guessing/round-tripping through
    # the UI to discover an auto-generated id.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
