# RecoveryOS — Docker Compose
# All 7 services: postgres, redis, api, event_processor, worker, prometheus, grafana
# Run with: docker compose up --build
#
# Env is loaded from .env (copy .env.example → .env and fill secrets)

services:

  # ─── Postgres ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: recoveryos_postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: recoveryos
      # Task 6: was a hardcoded literal ('recoveryos') — now sourced from
      # .env via docker compose's own ${VAR} substitution (read from .env in
      # the project root at `docker compose up` time, on the HOST, not
      # inside the container — env_file above is what makes the var visible
      # *inside* the container too, for anything that reads it directly).
      # Must match RECOVERYOS_APP_ROLE_PASSWORD, since migration 0002 targets
      # this same "recoveryos" login user.
      POSTGRES_PASSWORD: ${RECOVERYOS_APP_ROLE_PASSWORD:?RECOVERYOS_APP_ROLE_PASSWORD must be set in .env — see .env.example}
      POSTGRES_DB: recoveryos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveryos -d recoveryos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: recoveryos_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Alembic migrate (runs once, exits) ────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: recoveryos_migrate
    env_file: .env
    environment:
      DATABASE_URL_SYNC: postgresql://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
    command: >
      sh -c "alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── API (FastAPI / uvicorn) ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: recoveryos_api
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
      DATABASE_URL_SYNC: postgresql://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
      DIAGNOSER_DATABASE_URL: postgresql+asyncpg://diagnoser:${RECOVERYOS_DIAGNOSER_ROLE_PASSWORD}@postgres:5432/recoveryos
      INFERENCE_DATABASE_URL: postgresql+asyncpg://inference:${RECOVERYOS_INFERENCE_ROLE_PASSWORD}@postgres:5432/recoveryos
      REDIS_URL: redis://redis:6379/0
      ENV: demo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Event Processor (Redis Streams consumer: stream:payment_failed → Postgres) ──
  event_processor:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: recoveryos_event_processor
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
      DATABASE_URL_SYNC: postgresql://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
      REDIS_URL: redis://redis:6379/0
      ENV: demo
      PROMETHEUS_PORT: "9104"
    ports:
      - "9104:9104"
    command: ["python", "-m", "services.event_processor.consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Pipeline Orchestrator (Phase 7) ────────────────────────────────────────
  # Consumes stream:risk_engine (published by event_processor) and drives
  # each PAYMENT_FAILED payment through risk engine -> diagnosis -> recovery
  # engine -> policy engine -> action queue, per TRD §1.4.
  pipeline_orchestrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Production Architecture Domain Audit finding #3: NO container_name
    # (and no fixed host `ports:` publish, which would collide across
    # replicas) -- both are required for `docker compose up --scale
    # pipeline_orchestrator=N` to work at all. The Redis consumer-group
    # mechanics this service already uses (hostname+pid-derived consumer
    # names, XREADGROUP/XAUTOCLAIM) already support multiple replicas
    # sharing the same group; the ONLY thing blocking it was this
    # deployment config never having been wired to actually exercise
    # that -- see tests/integration/test_consumer_group_replica_distribution.py
    # for a real proof (multiple consumer instances, one stream, work
    # distributed not duplicated). /metrics stays reachable on the
    # internal docker network (other containers, e.g. Prometheus, can
    # still resolve it) even without a host-published port.
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
      DATABASE_URL_SYNC: postgresql://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
      DIAGNOSER_DATABASE_URL: postgresql+asyncpg://diagnoser:${RECOVERYOS_DIAGNOSER_ROLE_PASSWORD}@postgres:5432/recoveryos
      INFERENCE_DATABASE_URL: postgresql+asyncpg://inference:${RECOVERYOS_INFERENCE_ROLE_PASSWORD}@postgres:5432/recoveryos
      REDIS_URL: redis://redis:6379/0
      ENV: demo
      PROMETHEUS_PORT: "9101"
    expose:
      - "9101"
    command: ["python", "-m", "services.pipeline.consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Execution Worker (Phase 6) ────────────────────────────────────────────
  execution_worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    # Domain Audit finding #3 -- see pipeline_orchestrator's comment above
    # for why container_name/fixed ports: are gone (--scale compatibility).
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
      DATABASE_URL_SYNC: postgresql://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
      REDIS_URL: redis://redis:6379/0
      ENV: demo
      PROMETHEUS_PORT: "9102"
    expose:
      - "9102"
    command: ["python", "-m", "workers.execution_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Retry Scheduler (Task REPLAN1) ────────────────────────────────────────
  # Polls scheduled_reevaluations for RETRY_LATER decisions whose deferred
  # time has arrived and re-runs the full diagnose -> decide pipeline for
  # them from scratch. Needs the same diagnoser/inference DB roles as
  # pipeline_orchestrator since it re-enters services.pipeline.consumer.
  retry_scheduler:
    build:
      context: .
      dockerfile: workers/Dockerfile
    # Domain Audit finding #3 -- see pipeline_orchestrator's comment above
    # for why container_name/fixed ports: are gone (--scale compatibility).
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
      DATABASE_URL_SYNC: postgresql://recoveryos:${RECOVERYOS_APP_ROLE_PASSWORD}@postgres:5432/recoveryos
      DIAGNOSER_DATABASE_URL: postgresql+asyncpg://diagnoser:${RECOVERYOS_DIAGNOSER_ROLE_PASSWORD}@postgres:5432/recoveryos
      INFERENCE_DATABASE_URL: postgresql+asyncpg://inference:${RECOVERYOS_INFERENCE_ROLE_PASSWORD}@postgres:5432/recoveryos
      REDIS_URL: redis://redis:6379/0
      ENV: demo
      PROMETHEUS_PORT: "9103"
    expose:
      - "9103"
    command: ["python", "-m", "workers.retry_scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: recoveryos_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    depends_on:
      - api

  # ─── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: recoveryos_grafana
    restart: always
    env_file: .env
    ports:
      - "3001:3000"
    environment:
      # Task 6: was a hardcoded literal ('recoveryos') — a second credential
      # this same grep sweep found, beyond the two Postgres role passwords
      # the task named explicitly.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env — see .env.example}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
